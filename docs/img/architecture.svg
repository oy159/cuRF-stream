<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="cuRF-Stream 系统架构">
<title>cuRF-Stream 系统架构</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}</style>
<rect width="1200" height="560" rx="14" fill="#0d1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect x="24" y="24" width="400" height="512" rx="12" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
<text x="44" y="54" font-size="14" fill="#58a6ff" text-anchor="start" font-weight="700" class="mono">CPU · C++</text>
<rect x="520" y="24" width="656" height="512" rx="12" fill="none" stroke="#76b900" stroke-opacity="0.5" stroke-dasharray="4 4"/>
<text x="540" y="54" font-size="14" fill="#76b900" text-anchor="start" font-weight="700" class="mono">GPU · CUDA  (RTX 3050 Laptop, 60 W)</text>
<rect x="48" y="76" width="352" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.7"/>
<text x="64" y="105.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">OmniCore SDR · AD9361 2T2R</text>
<text x="64" y="125.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">2 × 61.44 MSPS · 12 bit · USB3 368.6 MB/s</text>
<line x1="224" y1="140" x2="224" y2="168" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="48" y="168" width="352" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.7"/>
<text x="64" y="197.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">USB 异步收包 → HostRing</text>
<text x="64" y="217.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">SPSC 无锁环 · 2 MB 大页 + cudaHostRegister</text>
<rect x="48" y="290" width="352" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.7"/>
<text x="64" y="319.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">调度 / 背压 / 丢样计量</text>
<text x="64" y="339.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">GPU 决定 batch · 样点时间戳查缺口</text>
<rect x="48" y="452" width="352" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.7"/>
<text x="64" y="481.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">浏览器界面（SSE）</text>
<text x="64" y="501.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">瀑布图 · 信号跟踪 · 识别标注</text>
<line x1="224" y1="354" x2="224" y2="452" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="544" y="76" width="608" height="60" rx="10" fill="#161b22" stroke="#76b900" stroke-opacity="0.7"/>
<circle cx="566" cy="106.0" r="12" fill="#76b900" opacity="0.18"/>
<text x="566" y="111.0" font-size="13" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">1</text>
<text x="588" y="103.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">多相信道化</text>
<text x="588" y="123.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">12 bit 解包融进 FIR fold + 批量 cuFFT · 512 × 120 kHz / 路</text>
<line x1="848" y1="136" x2="848" y2="152" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="544" y="152" width="608" height="60" rx="10" fill="#161b22" stroke="#76b900" stroke-opacity="0.7"/>
<circle cx="566" cy="182.0" r="12" fill="#76b900" opacity="0.18"/>
<text x="566" y="187.0" font-size="13" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">2</text>
<text x="588" y="179.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">功率 · 噪声底 · 白化</text>
<text x="588" y="199.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">25% 分位噪声底 · 前端噪声形状校准</text>
<line x1="848" y1="212" x2="848" y2="228" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="544" y="228" width="608" height="60" rx="10" fill="#161b22" stroke="#76b900" stroke-opacity="0.7"/>
<circle cx="566" cy="258.0" r="12" fill="#76b900" opacity="0.18"/>
<text x="566" y="263.0" font-size="13" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">3</text>
<text x="588" y="255.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">检测 · 泄漏抑制 · 压缩</text>
<text x="588" y="275.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">warp ballot 压缩活跃信道</text>
<line x1="848" y1="288" x2="848" y2="304" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="544" y="304" width="608" height="60" rx="10" fill="#161b22" stroke="#76b900" stroke-opacity="0.7"/>
<circle cx="566" cy="334.0" r="12" fill="#76b900" opacity="0.18"/>
<text x="566" y="339.0" font-size="13" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">4</text>
<text x="588" y="331.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">gather</text>
<text x="588" y="351.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">转置 + 归一化，直接写 fp16</text>
<line x1="848" y1="364" x2="848" y2="380" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="544" y="380" width="608" height="60" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity="0.7"/>
<circle cx="566" cy="410.0" r="12" fill="#f0883e" opacity="0.18"/>
<text x="566" y="415.0" font-size="13" fill="#f0883e" text-anchor="middle" font-weight="700" class="mono">5</text>
<text x="588" y="407.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">推理：自研 INT8 引擎</text>
<text x="588" y="427.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">6 个 kernel · CUDA Graph · 34.3 万窗口/秒</text>
<line x1="848" y1="440" x2="848" y2="456" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="544" y="456" width="608" height="60" rx="10" fill="#161b22" stroke="#76b900" stroke-opacity="0.7"/>
<circle cx="566" cy="486.0" r="12" fill="#76b900" opacity="0.18"/>
<text x="566" y="491.0" font-size="13" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">6</text>
<text x="588" y="483.0" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">softmax / argmax</text>
<text x="588" y="503.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400">每信道每 4.27 ms 一次识别</text>
<line x1="400" y1="200" x2="544" y2="106" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="470" y="140" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">H2D</text>
<path d="M544,486 C500,486 500,322 400,322" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="440" y="470" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">D2H</text>
<text x="440" y="488" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400">计数 · 结果 · 功率</text>
</svg>
