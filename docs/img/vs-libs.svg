<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="376" viewBox="0 0 1200 376" role="img" aria-label="与 CUTLASS / TensorRT / cuDNN 的对比">
<title>与 CUTLASS / TensorRT / cuDNN 的对比</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}</style>
<rect width="1200" height="376" rx="14" fill="#0d1117"/>
<text x="32" y="46" font-size="22" fill="#e6edf3" text-anchor="start" font-weight="700">与库的对比（FP16）</text>
<text x="32" y="72" font-size="13" fill="#8b949e" text-anchor="start" font-weight="400">同一 ONNX · 同一轮背靠背测量 · batch 512 · 千窗口/秒</text>
<line x1="260.0" y1="90" x2="260.0" y2="336" stroke="#30363d"/>
<text x="260.0" y="356" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">0k</text>
<line x1="423.6" y1="90" x2="423.6" y2="336" stroke="#30363d"/>
<text x="423.6363636363636" y="356" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">50k</text>
<line x1="587.3" y1="90" x2="587.3" y2="336" stroke="#30363d"/>
<text x="587.2727272727273" y="356" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">100k</text>
<line x1="750.9" y1="90" x2="750.9" y2="336" stroke="#30363d"/>
<text x="750.9090909090909" y="356" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">150k</text>
<line x1="914.5" y1="90" x2="914.5" y2="336" stroke="#30363d"/>
<text x="914.5454545454545" y="356" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400" class="mono">200k</text>
<text x="1160" y="84" font-size="12" fill="#8b949e" text-anchor="end" font-weight="400">自研领先</text>
<text x="246" y="125" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="600">自研 · 完整融合</text>
<rect x="260" y="106" width="668.9" height="28" rx="4" fill="#76b900" opacity="0.95"/>
<text x="938.9454545454545" y="125" font-size="14" fill="#76b900" text-anchor="start" font-weight="600" class="mono">204.4k</text>
<text x="246" y="173" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="400">CUTLASS 4.5</text>
<rect x="260" y="154" width="584.2" height="28" rx="4" fill="#8b949e" opacity="0.55"/>
<text x="854.1818181818182" y="173" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" class="mono">178.5k</text>
<text x="1160" y="173" font-size="16" fill="#76b900" text-anchor="end" font-weight="700" class="mono">1.15×</text>
<text x="246" y="221" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="400">自研 · 逐层不融合</text>
<rect x="260" y="202" width="578.9" height="28" rx="4" fill="#8b949e" opacity="0.55"/>
<text x="848.9454545454545" y="221" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" class="mono">176.9k</text>
<text x="1160" y="221" font-size="16" fill="#76b900" text-anchor="end" font-weight="700" class="mono">1.16×</text>
<text x="246" y="269" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="400">TensorRT 11.4</text>
<rect x="260" y="250" width="505.6" height="28" rx="4" fill="#8b949e" opacity="0.55"/>
<text x="775.6363636363636" y="269" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" class="mono">154.5k</text>
<text x="1160" y="269" font-size="16" fill="#76b900" text-anchor="end" font-weight="700" class="mono">1.32×</text>
<text x="246" y="317" font-size="15" fill="#e6edf3" text-anchor="end" font-weight="400">cuDNN 9.21</text>
<rect x="260" y="298" width="371.5" height="28" rx="4" fill="#8b949e" opacity="0.55"/>
<text x="641.4545454545455" y="317" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600" class="mono">113.5k</text>
<text x="1160" y="317" font-size="16" fill="#76b900" text-anchor="end" font-weight="700" class="mono">1.80×</text>
</svg>
