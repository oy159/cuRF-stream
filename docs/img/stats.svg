<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="关键指标">
<title>关键指标</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}</style>
<rect width="1200" height="150" rx="14" fill="#0d1117"/>
<rect x="30" y="20" width="218" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="139.2" y="66" font-size="32" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">1024</text>
<text x="139.2" y="94" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">信道同时识别</text>
<text x="139.2" y="114" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400">2 路 × 512 × 120 kHz</text>
<rect x="260" y="20" width="218" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="369.6" y="66" font-size="32" fill="#58a6ff" text-anchor="middle" font-weight="700" class="mono">300 s</text>
<text x="369.6" y="94" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">实采零丢样</text>
<text x="369.6" y="114" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400">2 × 61.44 MSPS 连续接收</text>
<rect x="491" y="20" width="218" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="600.0" y="66" font-size="32" fill="#58a6ff" text-anchor="middle" font-weight="700" class="mono">2.47 ms</text>
<text x="600.0" y="94" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">端到端 p99 延迟</text>
<text x="600.0" y="114" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400">实采 · 平均 318 个活跃信道</text>
<rect x="721" y="20" width="218" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="830.4000000000001" y="66" font-size="32" fill="#f0883e" text-anchor="middle" font-weight="700" class="mono">343k</text>
<text x="830.4000000000001" y="94" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">INT8 窗口/秒</text>
<text x="830.4000000000001" y="114" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400">6 个 kernel · CUDA Graph</text>
<rect x="952" y="20" width="218" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="1060.8" y="66" font-size="32" fill="#76b900" text-anchor="middle" font-weight="700" class="mono">1.32×</text>
<text x="1060.8" y="94" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="600">领先 TensorRT 11.4</text>
<text x="1060.8" y="114" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400">FP16 · batch 512</text>
</svg>
