<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cuRF-Stream</title>
<style>
  :root {
    --bg: #0d1014; --panel: #151a20; --line: #262e38; --text: #d8dee6; --dim: #7d8896; --hi: #1f2730;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "PingFang SC", sans-serif;
    --focus: #7aa7ff; --scroll-thumb: #536173; --scroll-track: #151a20; --scroll-hover: #7d8896; --scroll-active: #a7b9d0;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--scroll-thumb) var(--scroll-track); scrollbar-width: auto; }
  * { scrollbar-color: var(--scroll-thumb) var(--scroll-track); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 2px solid var(--scroll-track); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
  ::-webkit-scrollbar-thumb:active { background: var(--scroll-active); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); font-variant-numeric: tabular-nums; }
  button, select, summary { cursor: pointer; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-height: 28px; }
  button:hover, select:hover { background: var(--hi); }
  button:active { border-color: var(--focus); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled, select:disabled { cursor: default; opacity: .5; }
  [hidden] { display: none !important; }
  header { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .kv { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .kv b { color: var(--text); font-weight: 500; }
  #state.live b { color: #6fd08c; } #state.ended b { color: #e0b050; } #state.wait b { color: var(--dim); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 16px 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px;
          font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .chip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .chip b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .chip.off { opacity: 0.35; }
  .ctl { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  .ctl select, .ctl button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
                             padding: 2px 6px; font: inherit; cursor: pointer; }
  main { padding: 8px 16px 16px; display: grid; gap: 14px; }
  .stream { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 10px;
            display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; }
  @media (max-width: 1000px) { .stream { grid-template-columns: minmax(0, 1fr); } }
  .stream h2 { font-size: 12px; font-weight: 600; margin: 0 0 6px; display: flex; justify-content: space-between; color: var(--dim); }
  .stream h2 span:first-child { color: var(--text); }
  .plots { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; }
  canvas.wf { height: 250px; cursor: crosshair; }
  canvas.cls { height: 80px; margin-top: 3px; cursor: crosshair; }
  canvas.labels { height: 36px; }
  canvas.axis { height: 18px; }
  .plots > .sel { position: absolute; top: 0; bottom: 0; background: rgba(120, 170, 255, 0.15); border-left: 1px solid #7aa7ff;
         border-right: 1px solid #7aa7ff; pointer-events: none; display: none; }
  .tip { position: fixed; pointer-events: none; background: #0b0e12ee; border: 1px solid var(--line); border-radius: 4px;
         padding: 6px 8px; font: 12px/1.5 var(--mono); color: var(--text); display: none; z-index: 10; white-space: pre; }
  .list { border-left: 1px solid var(--line); padding-left: 10px; min-width: 0; display: flex; flex-direction: column; }
  .list h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--dim); display: flex; justify-content: space-between; }
  .rows { overflow: auto; max-height: 360px; min-height: 110px; scrollbar-gutter: stable; font: 12px/1.6 var(--mono); }
  .rows table { width: 100%; border-collapse: collapse; }
  .rows th { text-align: right; color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); padding: 0 4px; }
  .rows td { text-align: right; padding: 0 4px; white-space: nowrap; }
  .rows th:nth-child(3), .rows td:nth-child(3) { text-align: left; }
  .rows tr:hover td { background: var(--hi); }
  .rows .freq-action { border: 0; padding: 0 3px; color: var(--focus); font: inherit; background: transparent; white-space: nowrap; }
  .rows .inspect-action { padding: 1px 5px; font: inherit; white-space: nowrap; }
  .signal-sub { color: var(--dim); font-size: 11px; }
  .empty { color: var(--dim); padding: 18px 5px; font: 12px/1.7 var(--sans); }
  .policy-bar { margin: 0 16px; min-height: 38px; display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: center; color: var(--dim); font-size: 12px; }
  .policy-bar b { color: var(--text); font-weight: 500; }
  .notice { margin: 4px 16px; padding: 8px 10px; border: 1px solid #e0b050; border-radius: 4px; }
  .notice button { margin-left: 12px; }
  .engineering { grid-column: 1 / -1; min-width: 0; }
  body[data-view="demo"] .engineering { display: none; }
  body[data-view="engineering"] .demo-only { display: none; }
  details { border-top: 1px solid var(--line); padding-top: 7px; }
  summary { color: var(--dim); min-height: 28px; }
  .inspection { margin: 0; padding: 8px; background: var(--bg); max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 var(--mono); }
  .engine-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .policy-detail { margin: 0 16px 8px; }
  @media (max-width: 700px) { .engine-grid { grid-template-columns: minmax(0, 1fr); } header, .bar { gap: 8px 12px; } }
  @media (forced-colors: active) { * { scrollbar-color: auto; } :focus-visible { outline-color: Highlight; } }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  .rows i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  #air { display: none; }
  #air { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  @media (max-width: 1000px) { #air { grid-template-columns: minmax(0, 1fr); } }
  #air canvas { height: 300px; background: #10151b; border-radius: 4px; }
  #air .rows { max-height: 300px; }
  #air .rows th:nth-child(3), #air .rows td:nth-child(3) { text-align: right; }
  #air .rows th:nth-child(-n+2), #air .rows td:nth-child(-n+2) { text-align: left; }
  #air tr.sel td { background: var(--hi); }
  #end { margin: 0 16px 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: pre-wrap; display: none; }
</style>
</head>
<body data-view="demo">
<header>
  <h1>cuRF-Stream</h1>
  <span class="kv" id="state" role="status" aria-live="polite">状态 <b>等待数据</b></span>
  <span class="kv">源 <b id="src">-</b></span>
  <span class="kv">采样率 <b id="rate">-</b></span>
  <span class="kv">中心频率 <b id="fc">-</b></span>
  <span class="kv">时间 <b id="t">-</b></span>
  <span class="kv">行/秒 <b id="rps">-</b></span>
</header>
<div class="bar">
  <label class="ctl" for="mode">视图
    <select id="mode"><option value="demo">演示视图</option><option value="engineering">工程视图</option></select>
  </label>
  <div class="legend" id="legend"></div>
  <label class="ctl" for="tau">逐信道平滑
    <select id="tau"><option value="0.15">0.15 s</option><option value="0.5" selected>0.5 s</option><option value="2">2 s</option></select>
  </label>
  <label class="ctl"><input type="checkbox" id="steady">只看持续信号</label>
  <div class="ctl"><button id="zoom-in" disabled>放大</button><button id="zoom-out" disabled>缩小</button><button id="reset" disabled>全带宽</button><span>也可拖动瀑布图，或点击信号频率</span></div>
</div>
<div class="policy-bar"><span id="policy-note">等待信号级数据；演示识别结合频段规划。</span><span id="policy-counts">累计记录：—</span></div>
<div class="notice" id="feed-error" role="alert" hidden><span></span><button id="reconnect" disabled>重新连接</button></div>
<details class="engineering policy-detail"><summary>策略参数与抑制计数</summary><pre class="inspection" id="policy-detail">等待策略信息</pre></details>
<main id="streams"></main>
<div style="padding:0 16px 14px"><section class="stream" id="air">
  <div class="plots"><h2><span>ADS-B 1090 MHz · CRC 通过</span><span class="info" id="air-info"></span></h2><button id="air-focus" disabled>定位接收频段</button><canvas id="air-map" role="img" aria-label="已通过 CRC 的飞机位置与航迹；详细数值见飞机表"></canvas></div>
  <div class="list"><h3><span>飞机</span><span class="n" id="air-n"></span></h3><div class="rows" id="air-rows"></div></div>
</section></div>
<div id="end"></div>
<div class="tip" id="tip"></div>
<script src="/app.js"></script>
</body>
</html>
